<div class="logo" style="justify-content: center; margin-bottom: 24px;">
  <img src="/assets/logotaskflow.png" alt="TaskFlow Logo" />
</div>
<mat-card style="max-width: 900px; margin: 0 auto; box-shadow: 0 2px 8px rgba(25, 118, 210, 0.08);">
  <div class="user-list-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
    <span style="font-size: 1.5rem; font-weight: 600; color: #1976d2;">User Management</span>
    <button mat-raised-button color="primary" (click)="createUser()">
      <mat-icon>person_add</mat-icon> Add User
    </button>
  </div>
  <div *ngIf="error" class="error-text" style="color: #e53935; text-align: center;">{{ error }}</div>
  <div *ngIf="users.length; else noUsers">
    <table mat-table [dataSource]="users" class="mat-elevation-z8 full-width-table" style="margin-bottom: 16px;">
      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let user">{{ user.id }}</td>
      </ng-container>
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let user">{{ user.name }}</td>
      </ng-container>
      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>
      <!-- Role Column -->
      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Role</th>
        <td mat-cell *matCellDef="let user">{{ user.role }}</td>
      </ng-container>
      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let user">
          <button mat-icon-button color="primary" (click)="editUser(user.id)" matTooltip="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteUser(user.id)" matTooltip="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['id', 'name', 'email', 'role', 'actions']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['id', 'name', 'email', 'role', 'actions']"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </div>
  <ng-template #noUsers>
    <div class="empty-state" style="text-align: center; color: #757575; padding: 32px 0;">No users found.</div>
  </ng-template>
</mat-card>
