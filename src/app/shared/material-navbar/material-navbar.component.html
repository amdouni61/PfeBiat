<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" fixedInViewport
      [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
      [mode]="(isHandset$ | async) ? 'over' : 'side'"
      [opened]="sidebarOpened">
    <div class="logo">
      <img src="/assets/logotaskflow.png" alt="TaskFlow Logo" />
      <span>TaskFlow</span>
    </div>
    <mat-toolbar>Menu</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard"><mat-icon>dashboard</mat-icon> Dashboard</a>
      <a mat-list-item routerLink="/tasks"><mat-icon>assignment</mat-icon> Tasks</a>
      <a *ngIf="isSupervisorOrAdmin()" mat-list-item routerLink="/task-validation"><mat-icon>verified_user</mat-icon> Task Validation</a>
      <a *ngIf="isAdmin()" mat-list-item routerLink="/teams"><mat-icon>group</mat-icon> Teams</a>
      <a *ngIf="isAdmin()" mat-list-item routerLink="/users"><mat-icon>people</mat-icon> Users</a>
      <a mat-list-item routerLink="/comments"><mat-icon>comment</mat-icon> Comments</a>
      <a *ngIf="isAuthenticated()" mat-list-item routerLink="/profile"><mat-icon>person</mat-icon> Profile</a>
      <a *ngIf="isAuthenticated()" mat-list-item routerLink="/settings"><mat-icon>settings</mat-icon> Settings</a>
      <a *ngIf="!isAuthenticated()" mat-list-item routerLink="/login"><mat-icon>login</mat-icon> Login</a>
      <a *ngIf="!isAuthenticated()" mat-list-item routerLink="/register"><mat-icon>person_add</mat-icon> Register</a>
      <a *ngIf="isAuthenticated()" mat-list-item (click)="logout()" style="cursor:pointer;"><mat-icon>logout</mat-icon> Logout</a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button
        type="button"
        aria-label="Toggle sidenav"
        mat-icon-button
        (click)="toggleSidebar()">
        <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
      </button>
      <div class="logo">
        <img src="/assets/logotaskflow.png" alt="TaskFlow Logo" />
        <span>TaskFlow</span>
      </div>
    </mat-toolbar>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
