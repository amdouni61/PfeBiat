<mat-card class="task-form-card">
  <h2 mat-card-title>{{ isEdit ? 'Edit Task' : 'Create Task' }}</h2>
  <form (ngSubmit)="saveTask()">
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Title</mat-label>
      <input matInput type="text" [(ngModel)]="task.title" name="title" required />
    </mat-form-field>
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput [(ngModel)]="task.description" name="description"></textarea>
    </mat-form-field>
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Status</mat-label>
      <input matInput type="text" [(ngModel)]="task.status" name="status" required />
    </mat-form-field>
    <div *ngIf="error" style="color:red;">{{ error }}</div>
    <button mat-raised-button color="primary" type="submit">{{ isEdit ? 'Update' : 'Create' }} Task</button>
  </form>
</mat-card>
