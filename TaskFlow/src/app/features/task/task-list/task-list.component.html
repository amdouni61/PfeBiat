<div class="mat-elevation-z8">
  <button mat-raised-button color="primary" (click)="createTask()">New Task</button>
  <mat-table [dataSource]="tasks" class="mat-elevation-z8" *ngIf="tasks.length">
    <ng-container matColumnDef="id">
      <mat-header-cell *matHeaderCellDef> ID </mat-header-cell>
      <mat-cell *matCellDef="let task"> {{task.id}} </mat-cell>
    </ng-container>
    <ng-container matColumnDef="title">
      <mat-header-cell *matHeaderCellDef> Title </mat-header-cell>
      <mat-cell *matCellDef="let task"> {{task.title}} </mat-cell>
    </ng-container>
    <ng-container matColumnDef="status">
      <mat-header-cell *matHeaderCellDef> Status </mat-header-cell>
      <mat-cell *matCellDef="let task"> {{task.status}} </mat-cell>
    </ng-container>
    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
      <mat-cell *matCellDef="let task">
        <button mat-button color="accent" (click)="viewTask(task.id)">View</button>
        <button mat-button color="warn" (click)="deleteTask(task.id)">Delete</button>
      </mat-cell>
    </ng-container>
    <mat-header-row *matHeaderRowDef="['id', 'title', 'status', 'actions']"></mat-header-row>
    <mat-row *matRowDef="let row; columns: ['id', 'title', 'status', 'actions'];"></mat-row>
  </mat-table>
  <mat-card *ngIf="!tasks.length && !error">No tasks found.</mat-card>
  <mat-card *ngIf="error" color="warn">{{ error }}</mat-card>
</div>
