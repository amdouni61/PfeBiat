<mat-card class="team-form-card">
  <h2 mat-card-title>{{ isEdit ? 'Edit Team' : 'Create Team' }}</h2>
  <form (ngSubmit)="saveTeam()">
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput type="text" [(ngModel)]="team.name" name="name" required />
    </mat-form-field>
    <div *ngIf="error" style="color:red;">{{ error }}</div>
    <button mat-raised-button color="primary" type="submit">{{ isEdit ? 'Update' : 'Create' }} Team</button>
  </form>
</mat-card>
