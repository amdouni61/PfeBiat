<div class="logo" style="justify-content: center; margin-bottom: 24px;">
  <img src="/assets/logotaskflow.png" alt="TaskFlow Logo" />
</div>
<mat-card class="comment-form-card" style="max-width: 400px; margin: 0 auto; box-shadow: 0 2px 8px rgba(25, 118, 210, 0.08);">
  <mat-card-title style="text-align: center; margin-bottom: 16px;">{{ isEdit() ? 'Edit Comment' : 'Create Comment' }}</mat-card-title>
  <form [formGroup]="commentForm" (ngSubmit)="saveComment()" style="display: flex; flex-direction: column; gap: 18px;">
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Content</mat-label>
      <mat-icon matPrefix>comment</mat-icon>
      <textarea matInput rows="3" formControlName="content" required></textarea>
      <mat-error *ngIf="commentForm.get('content')?.invalid && commentForm.get('content')?.touched">Content is required</mat-error>
    </mat-form-field>
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Task ID</mat-label>
      <mat-icon matPrefix>assignment</mat-icon>
      <input matInput type="number" formControlName="taskId" required />
      <mat-error *ngIf="commentForm.get('taskId')?.invalid && commentForm.get('taskId')?.touched">Task ID is required</mat-error>
    </mat-form-field>
    <div *ngIf="error()" class="error-text" style="color: #e53935; text-align: center;">{{ error() }}</div>
    <button mat-raised-button color="primary" type="submit" class="full-width" style="margin-top: 8px;" [disabled]="commentForm.invalid || loading()">
      <mat-icon>{{ isEdit() ? 'edit' : 'add' }}</mat-icon>
      {{ isEdit() ? 'Update' : 'Create' }} Comment
      <mat-spinner *ngIf="loading()" diameter="20" style="margin-left: 8px;"></mat-spinner>
    </button>
  </form>
</mat-card>
