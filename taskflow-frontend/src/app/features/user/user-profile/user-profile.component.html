<div class="page-container">
  <div class="content-wrapper">
    <div class="profile-header">
      <h1 class="profile-title">User Profile</h1>
    </div>

    <div class="profile-content">
      <div class="profile-card" *ngIf="user()">
        <div class="profile-avatar">
          <mat-icon class="avatar-icon">account_circle</mat-icon>
        </div>
        
        <div class="profile-info">
          <h2 class="user-name">{{ user()?.fullName }}</h2>
          <p class="user-email">{{ user()?.email }}</p>
          <p class="user-role">Role: {{ user()?.role }}</p>
          <p class="user-username">Username: {{ user()?.username }}</p>
        </div>

        <div class="profile-actions">
          <button mat-raised-button color="primary" (click)="editProfile()">
            <mat-icon>settings</mat-icon>
            Edit Settings
          </button>
        </div>
      </div>

      <div class="empty-container" *ngIf="!user()">
        <mat-icon>person</mat-icon>
        <p>User profile not found</p>
        <button mat-raised-button color="primary" routerLink="/login">
          Login
        </button>
      </div>
    </div>
  </div>
</div>
